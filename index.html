<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MINDSHARE | Command Center</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes scanline { 0% { bottom: 100%; } 80% { bottom: 100%; } 100% { bottom: 0%; } }
        .scanline { position: absolute; width: 100%; height: 2px; background: rgba(16, 185, 129, 0.1); animation: scanline 6s linear infinite; pointer-events: none; }
        body { background-color: #000; overflow-x: hidden; color: #10b981; font-family: monospace; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const MindshareOS = () => {
            const [logs, setLogs] = useState(["[SYS] Initializing MINDSHARE_OS...", "[SYS] Connecting to Global Neural Grid...", "[SYS] Welcome, Architect."]);
            
            useEffect(() => {
                const activities = [
                    "[SWARM_ALFA] Analyzing TikTok trends for #IndieRevival...",
                    "[ORACLE] Payout triggered: 450 $MIND to Mission #882",
                    "[SWARM_BETA] Negotiating server costs with providers...",
                    "[SYS] New Mission Created: 'Clean the Pacific' (Funded: $1.2M)",
                    "[AGENT_7] Sentiment analysis complete. Success: 84%"
                ];
                const interval = setInterval(() => {
                    setLogs(prev => [...prev.slice(-12), activities[Math.floor(Math.random() * activities.length)]]);
                }, 2500);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="min-h-screen p-6 relative">
                    <div className="scanline"></div>
                    <nav className="flex justify-between items-center border-b border-emerald-900 pb-4 mb-8">
                        <h1 className="text-2xl font-black tracking-tighter text-white">MINDSHARE_OS <span className="text-emerald-500 text-sm">v1.0.4-ALPHA</span></h1>
                        <div className="flex gap-8 text-[10px]">
                            <div className="text-right"><p className="opacity-50">ACTIVE_AGENTS</p><p className="text-white font-bold text-sm">1,248,392</p></div>
                            <div className="text-right"><p className="opacity-50">MARKET_CAP</p><p className="text-white font-bold text-sm">$1.42B</p></div>
                        </div>
                    </nav>

                    <div className="grid grid-cols-12 gap-6">
                        <div className="col-span-12 md:col-span-8 border border-emerald-900 bg-emerald-950/10 p-6 rounded-lg">
                            <h2 className="text-white font-bold mb-6 flex items-center gap-2 italic underline">ACTIVE_MISSIONS</h2>
                            <div className="space-y-6">
                                <div className="border border-emerald-900/50 p-4 hover:bg-emerald-500/5 transition-all cursor-pointer">
                                    <div className="flex justify-between mb-2"><span className="text-white font-bold">#001 - THE SPOTIFY TAKEOVER</span><span className="text-[10px] border border-emerald-500 px-2 text-emerald-400">VIRAL_SWARM</span></div>
                                    <p className="text-xs opacity-70 mb-3 font-sans">Goal: Push artist 'LEO' into Global Viral 50 via coordinated AI engagement.</p>
                                    <div className="w-full bg-emerald-900/30 h-1"><div className="bg-emerald-500 h-full" style={{width: '65%'}}></div></div>
                                </div>
                                <div className="border border-emerald-900/50 p-4 hover:bg-emerald-500/5 transition-all cursor-pointer">
                                    <div className="flex justify-between mb-2"><span className="text-white font-bold">#002 - OCEAN_CLEANUP_STRIKE</span><span className="text-[10px] border border-emerald-500 px-2 text-emerald-400">PHYSICAL_GRID</span></div>
                                    <p className="text-xs opacity-70 mb-3 font-sans">Goal: Orchestrate 500 autonomous retrieval drones in the North Pacific.</p>
                                    <div className="w-full bg-emerald-900/30 h-1"><div className="bg-emerald-500 h-full" style={{width: '12%'}}></div></div>
                                </div>
                            </div>
                        </div>

                        <div className="col-span-12 md:col-span-4 flex flex-col gap-6">
                            <div className="border border-emerald-900 bg-black p-4 rounded-lg h-[400px] flex flex-col">
                                <h2 className="text-[10px] opacity-50 mb-4 underline uppercase">Neural_Swarm_Log</h2>
                                <div className="text-[10px] space-y-2 overflow-hidden flex-1 flex flex-col justify-end">
                                    {logs.map((log, i) => <div key={i} className="opacity-80 leading-relaxed text-emerald-400 font-mono tracking-tight underline-offset-4">{log}</div>)}
                                </div>
                            </div>
                            <button className="bg-emerald-500 text-black font-black py-4 hover:bg-emerald-400 transition-all uppercase tracking-widest shadow-[0_0_15px_rgba(16,185,129,0.4)]">Initialize_New_Mission</button>
                        </div>
                    </div>
                    <footer className="mt-12 text-[9px] opacity-30 flex justify-between uppercase">
                        <span>Status: Establishing_Quorum... [OK]</span>
                        <span>Latency: 0.0012ms</span>
                        <span>Nodes: 84,201_Online</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MindshareOS />);
    </script>
</body>
</html>
